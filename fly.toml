# Fly.io config for Life Admin. See README → "Deploying to Fly.io".
#
# IMPORTANT: run exactly ONE machine. The SQLite database lives on that
# machine's volume; a second machine would get its own, separate database.
# (Deploy with `fly deploy --ha=false`.)

app = "life-admin-josh"          # must be globally unique on Fly; change it to your app's name
primary_region = "iad"      # pick the region closest to you: `fly platform regions`

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/life-admin.db"
  # CLIENT_ORIGIN defaults to https://<app>.fly.dev (from Fly's FLY_APP_NAME).
  # Only set it when you add a custom domain:  CLIENT_ORIGIN = "https://lifeadmin.example.com"
  TRUST_PROXY = "1"         # Fly's edge proxy is exactly one hop in front of the app
  # SIGNUP_ALLOWED_EMAILS is set as a secret (keeps emails out of git):
  #   fly secrets set SIGNUP_ALLOWED_EMAILS="you@example.com,friend@example.com"

[http_service]
  internal_port = 8080
  force_https = true        # http:// redirects to https://
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # stops when idle to save money; first request after wakes it (~1-2 s)

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "life_admin_data"
  destination = "/data"
  snapshot_retention = 14   # Fly's daily volume snapshots, kept 14 days

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"          # scrypt uses ~128 MB per login/signup hash; 256 MB is too tight
